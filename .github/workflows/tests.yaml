name: CI (Unit + Integration)

on:
  push:
  pull_request:

env:
  MAVEN_OPTS: >-
    -Dhttp.keepAlive=false
    -Dmaven.wagon.http.pool=false
    -Dmaven.wagon.http.retryHandler.class=standard
    -Dmaven.wagon.http.retryHandler.count=3

permissions:
  contents: read
  packages: write

jobs:
  build-ci-image:
    name: Build & Push CI Image
    runs-on: ubuntu-22.04
    outputs:
      image_name: ghcr.io/${{ github.repository_owner }}/livy-ci
      image_digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/livy-ci
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push livy-ci image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dev/docker/livy-dev-base/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  unit-tests:
    name: Unit tests
    needs: build-ci-image
    runs-on: ubuntu-22.04
    container:
      image: ${{ needs.build-ci-image.outputs.image_name }}@${{ needs.build-ci-image.outputs.image_digest }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      matrix:
        maven_profile:
          - "-Phadoop3 -Pscala-2.13 -Pspark3"
    steps:
      - uses: actions/checkout@v4

      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: |
            /root/.m2/repository
            !/root/.m2/repository/org/apache/livy
          key: ${{ runner.os }}-maven-${{ hashFiles('pom.xml', '*/pom.xml', 'thriftserver/*/pom.xml', 'core/*/pom.xml', 'repl/*/pom.xml', 'scala-api/*/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Build with Maven (unit only)
        run: mvn ${{ matrix.maven_profile }} -DskipITs -Dmaven.javadoc.skip=true -Drat.skip=true -B -V -e verify

      - name: Upload coverage to codecov
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false

  integration-tests:
    name: Integration tests
    needs: build-ci-image
    runs-on: ubuntu-22.04
    container:
      image: ${{ needs.build-ci-image.outputs.image_name }}@${{ needs.build-ci-image.outputs.image_digest }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      matrix:
        maven_profile:
          - "-Phadoop3 -Pscala-2.13 -Pspark3"
    steps:
      - uses: actions/checkout@v4

      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: |
            /root/.m2/repository
            !/root/.m2/repository/org/apache/livy
          key: ${{ runner.os }}-maven-${{ hashFiles('pom.xml', '*/pom.xml', 'thriftserver/*/pom.xml', 'core/*/pom.xml', 'repl/*/pom.xml', 'scala-api/*/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Build with Maven (skip unit tests)
        run: mvn ${{ matrix.maven_profile }} -DskipTests -Dmaven.javadoc.skip=true -Drat.skip=true -B -V -e verify

      - name: Upload coverage to codecov
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
