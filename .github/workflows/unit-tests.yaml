name: Unit Tests
on:
  push:
  pull_request:

env:
  MAVEN_OPTS: >-
    -Dhttp.keepAlive=false
    -Dmaven.wagon.http.pool=false
    -Dmaven.wagon.http.retryHandler.class=standard
    -Dmaven.wagon.http.retryHandler.count=3

permissions:
  contents: read
  packages: write

jobs:
  build-ci-image:
    name: Build & Push CI Image
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push livy-ci image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dev/docker/livy-dev-base/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ toLower(github.repository_owner) }}/livy-ci:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  unit-tests:
    name: Unit tests
    needs: build-ci-image
    runs-on: ubuntu-22.04
    container: ghcr.io/${{ toLower(github.repository_owner) }}/livy-ci:latest
    strategy:
      matrix:
        maven_profile:
          - "-Phadoop3 -Pscala-2.13 -Pspark3"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: |
            /root/.m2/repository
            !/root/.m2/repository/org/apache/livy
          key: ${{ runner.os }}-maven-${{ hashFiles('pom.xml', '*/pom.xml', 'thriftserver/*/pom.xml', 'core/*/pom.xml', 'repl/*/pom.xml', 'scala-api/*/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven
        run: |
          mvn -Pthriftserver ${{ matrix.maven_profile }} -DskipITs -Dmaven.javadoc.skip=true -B -V -e verify

      - name: Upload coverage to codecov
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
